<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&family=Fira+Code:wght@300..700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link id="theme-fonts" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-tertiary-foreground: var(--tertiary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
        --font-family-mono: var(--font-mono);
        /* Tailwind v4's font namespace is --font-*, NOT --font-family-*.
         *
         * Without this line the font-heading utility does not exist at all,
         * so every h1–h6 the design prompt mandates (font-heading) silently
         * inherited the body's font-sans. A user could set --font-heading a
         * dozen times, watch the tool report success, and never see the
         * typeface change — the "font applied but not reflected" report.
         *
         * font-sans and font-mono are Tailwind built-ins and already read
         * :root, which is why only headings were broken. The fallback chain
         * keeps themes that never set a heading font rendering the body face
         * instead of nothing. */
        --font-heading: var(--font-heading, var(--font-sans, ui-sans-serif, system-ui, sans-serif));
      }

      /* Every filled surface carries its own text colour.
       *
       * Without this, <div class="bg-accent"> inherits --foreground from
       * <html> — a colour chosen to contrast the PAGE, not the accent fill. On
       * a dark theme with a bright accent that renders near-white text on
       * near-white (or near-black on near-black): the invisible text users
       * report. Pairing each fill with its own foreground makes the readable
       * result the default instead of something the model has to remember.
       *
       * These sit in @layer base deliberately. Any explicit text-* utility is
       * in @layer utilities and therefore still wins, so an intentional colour
       * choice is never overridden. The neutral surfaces (background, muted)
       * are left out: --foreground is already guaranteed readable on those, and
       * forcing --muted-foreground would wash out headings in muted panels.
       */
      @layer base {
        .bg-card { color: var(--card-foreground); }
        .bg-popover { color: var(--popover-foreground, var(--card-foreground)); }
        .bg-primary { color: var(--primary-foreground); }
        .bg-secondary { color: var(--secondary-foreground); }
        .bg-accent { color: var(--accent-foreground, var(--foreground)); }
        .bg-tertiary { color: var(--tertiary-foreground, var(--primary-foreground)); }
        .bg-destructive { color: var(--destructive-foreground, var(--primary-foreground)); }
      }
      :root {
        --background: #F7F9FC;
        --foreground: #172033;
        --primary: #2563EB;
        --primary-foreground: #FFFFFF;
        --secondary: #EAF1FF;
        --secondary-foreground: #1E3A8A;
        --tertiary: #16A34A;
        --muted: #EEF2F7;
        --muted-foreground: #606F86;
        --accent: #DBEAFE;
        --accent-foreground: #1E3A8A;
        --card: #FFFFFF;
        --card-foreground: #172033;
        --destructive: #DC2626;
        --border: #DCE3EE;
        --input: #CBD5E1;
        --ring: #2563EB;
        --radius: 0.75rem;
        --font-sans: Inter, sans-serif;
        --font-heading: Manrope, Inter, sans-serif;
        --font-mono: JetBrains Mono, monospace;
        --shadow-offset-x: 0;
        --shadow-offset-y: 10;
        --shadow-blur: 30;
        --shadow-spread: -8;
        --shadow-color: rgba(15, 23, 42, 0.12);
        --tertiary-foreground: #272727;
        --destructive-foreground: #FFFFFF;
        --primary-text: #2563EB;
        --secondary-text: #6D7380;
        --tertiary-text: #00852D;
        --accent-text: #677486;
        --destructive-text: #DC2626;
        }
    </style>
    <style>
      .brand-gradient { background-image: linear-gradient(135deg, var(--primary), var(--accent)); }
      .shadow-theme {
        box-shadow:
          calc(var(--shadow-offset-x, 0) * 1px) calc(var(--shadow-offset-y, 10) * 1px)
          calc(var(--shadow-blur, 30) * 1px) calc(var(--shadow-spread, -8) * 1px)
          var(--shadow-color, rgba(15, 23, 42, 0.12));
      }

      /* Brand colours used as TEXT resolve to a legibility-adjusted variant.
       *
       * --primary and friends are tuned to look right as FILLS; painted as text
       * on the page they are routinely too light — a #16A34A "+8.4%" on a white
       * card measures 3.3:1. The --*-text tokens are the same hue and chroma
       * with lightness nudged just far enough to clear AA on the page and card
       * surfaces, so fills keep the exact brand colour while text becomes
       * readable.
       *
       * This block is intentionally UNLAYERED: unlayered declarations outrank
       * every cascade layer, so these beat Tailwind's own text-* utilities. The
       * var() fallbacks leave documents that predate the derived tokens
       * rendering exactly as before.
       */
      .text-primary { color: var(--primary-text, var(--primary)); }
      .text-secondary { color: var(--secondary-text, var(--secondary)); }
      .text-tertiary { color: var(--tertiary-text, var(--tertiary)); }
      .text-accent { color: var(--accent-text, var(--accent)); }
      .text-destructive { color: var(--destructive-text, var(--destructive)); }
    </style>
  </head>
  <body>
<div class="min-h-screen w-full bg-background flex flex-col relative"><header class="h-20 bg-card border-b border-border px-10 flex items-center justify-between"><div class="flex items-center gap-4"><div class="h-10 w-10 rounded-xl bg-primary text-primary-foreground flex items-center justify-center"><iconify-icon icon="lucide:graduation-cap" class="text-xl"></iconify-icon></div><p class="font-heading font-bold">Northstar <span class="text-muted-foreground font-normal">/ Add school</span></p></div><a data-uxm-link="Schools" class="text-sm text-primary font-semibold">Back to schools</a></header><main class="max-w-6xl w-full mx-auto p-8"><div class="mb-7"><p class="text-sm text-muted-foreground">School onboarding</p><h1 class="text-2xl font-heading font-bold">Create a school organization</h1><p class="text-sm text-muted-foreground mt-1">Set up the school, assign its first administrator, and activate a subscription.</p></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-6"><section class="bg-card border border-border rounded-xl p-6"><h2 class="text-lg font-heading font-semibold">School information</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5"><label class="text-sm font-medium">School name<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="e.g. Cedar Grove Academy"></label><label class="text-sm font-medium">School code<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="e.g. CGA-2048"></label><label class="text-sm font-medium">School email<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="admin@school.edu"></label><label class="text-sm font-medium">School phone<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="+1 (555) 000-0000"></label><label class="text-sm font-medium md:col-span-2">Address<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="Street address"></label><label class="text-sm font-medium">City<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="City"></label><label class="text-sm font-medium">State / Province<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="State"></label><label class="text-sm font-medium">Country<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="Country"></label><label class="text-sm font-medium">Pincode<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="Postal code"></label></div></section><section class="bg-card border border-border rounded-xl p-6"><h2 class="text-lg font-heading font-semibold">Primary school admin</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5"><label class="text-sm font-medium">Admin name<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="Full name"></label><label class="text-sm font-medium">Admin email<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="name@school.edu"></label><label class="text-sm font-medium">Admin mobile<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="+1 (555) 000-0000"></label><label class="text-sm font-medium">Temporary password<input class="mt-2 w-full rounded-lg border border-input p-3" placeholder="Create secure password"></label></div></section></div><aside class="space-y-6"><section class="bg-card border border-border rounded-xl p-6"><h2 class="text-lg font-heading font-semibold">School logo</h2><div class="border-2 border-dashed border-border rounded-xl p-8 mt-4 text-center text-sm text-muted-foreground"><iconify-icon icon="lucide:upload" class="text-2xl mb-2"></iconify-icon><p class="font-medium text-foreground">Upload logo</p><p>PNG or JPG, up to 2MB</p></div></section><section class="bg-card border border-border rounded-xl p-6"><h2 class="text-lg font-heading font-semibold">Subscription</h2><div class="space-y-4 mt-4"><label class="text-sm font-medium">Select plan<select class="mt-2 w-full rounded-lg border border-input p-3"><option>Premium — $299 / month</option><option>Standard — $149 / month</option><option>Basic — $79 / month</option></select></label><label class="text-sm font-medium">Start date<input type="date" class="mt-2 w-full rounded-lg border border-input p-3"></label><label class="text-sm font-medium">Expiry date<input type="date" class="mt-2 w-full rounded-lg border border-input p-3"></label><label class="text-sm font-medium">Subscription status<select class="mt-2 w-full rounded-lg border border-input p-3"><option>Active</option><option>Trial</option><option>Pending</option></select></label></div></section></aside></div><div class="flex justify-end gap-3 mt-8"><a data-uxm-link="Schools" class="min-h-11 border border-border rounded-lg px-5 py-3 font-semibold">Cancel</a><button class="min-h-11 bg-primary text-primary-foreground rounded-lg px-5 font-semibold">Create school</button></div></main></div>
</body></html>
